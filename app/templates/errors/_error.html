{% extends "base_bare.html" %}
{% block title %}{{ code }} - LicenseHubK12{% endblock %}
{% block content %}
<div class="card login-card shadow-sm">
  <div class="card-body text-center p-4">
    <div class="display-4 fw-bold text-body-secondary mb-2">{{ code }}</div>
    <h1 class="h4 mb-3">{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-2">Return to dashboard</a>
  </div>
</div>
{% endblock %}
