{% if pagination and pagination.pages > 1 %}
{% set base_args = dict(request.view_args or {}, **request.args.to_dict()) %}
<nav aria-label="Pagination">
  <ul class="pagination pagination-sm">
    <li class="page-item {{ 'disabled' if not pagination.has_prev }}">
      <a class="page-link" href="{{ url_for(request.endpoint, **dict(base_args, page=pagination.prev_num)) if pagination.has_prev else '#' }}">Previous</a>
    </li>
    {% for p in pagination.iter_pages() %}
      {% if p %}
        <li class="page-item {{ 'active' if p == pagination.page }}">
          <a class="page-link" href="{{ url_for(request.endpoint, **dict(base_args, page=p)) }}">{{ p }}</a>
        </li>
      {% else %}
        <li class="page-item disabled"><span class="page-link">…</span></li>
      {% endif %}
    {% endfor %}
    <li class="page-item {{ 'disabled' if not pagination.has_next }}">
      <a class="page-link" href="{{ url_for(request.endpoint, **dict(base_args, page=pagination.next_num)) if pagination.has_next else '#' }}">Next</a>
    </li>
  </ul>
</nav>
{% endif %}
