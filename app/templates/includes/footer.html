<footer class="app-footer text-center text-muted small py-3 border-top mt-auto">
  &copy; {{ current_year }} {{ app_name }}. All rights reserved.
  &middot;
  <button type="button" class="btn btn-link btn-sm p-0 align-baseline" data-bs-toggle="modal" data-bs-target="#aboutModal">About</button>
</footer>

<div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center p-4 position-relative">
        <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
        <img src="{{ url_for('static', filename='img/licensehub-favicon.png') }}" alt="{{ app_name }}" width="96" height="96" class="rounded-circle mb-3">
        <h2 class="h5 mb-2" id="aboutModalLabel">{{ app_name }}</h2>
        <p class="text-muted small mb-3">K-12 school district software license management platform &mdash; track licenses, vendors, contracts, and per-school allocations.</p>
        <span class="badge rounded-pill text-bg-light border mb-3">Version {{ app_version }}</span>
        <p class="text-muted small mb-0">&copy; {{ current_year }} {{ app_name }}. All rights reserved.</p>
      </div>
      <div class="modal-footer justify-content-center border-0 pt-0">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
