{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-container mb-3" role="status" aria-live="polite">
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" data-auto-dismiss role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
