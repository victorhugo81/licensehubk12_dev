[project]
name = "licensehubk12"
version = "0.1.0"
description = "K-12 educational software license management platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "flask-login==0.6.3",
    "flask-wtf==1.3.0",
    "flask-migrate==4.1.0",
    "flask-limiter==4.1.1",
    "flask-apscheduler==1.13.1",
    "email-validator==2.3.0",
    "python-dotenv==1.1.1",
    "pymysql==1.1.3",
    "cryptography==47.0.0",
    "gunicorn==25.3.0",
    "openpyxl==3.1.5",
    "reportlab==4.2.5",
    "werkzeug==3.1.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-flask==1.3.0",
]
